# 📱 Builds the Noël Tier 1 Hub iPhone app on GitHub's Mac computers (no Mac needed).
#
# • Every push to main: a quick check that the iPhone app still builds (no Apple account needed).
# • "Run workflow" button (Actions tab → Build iPhone app): builds, signs and uploads to
#   TestFlight / App Store Connect. Needs these repository secrets (Settings → Secrets → Actions):
#     APPLE_TEAM_ID   your 10-character Team ID (developer.apple.com → Membership)
#     ASC_KEY_ID      App Store Connect API key ID
#     ASC_ISSUER_ID   App Store Connect API issuer ID
#     ASC_KEY_P8      the full text of the downloaded AuthKey_XXXX.p8 file
name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      edition:
        description: "Which app to build and upload"
        type: choice
        default: family
        options:
          - family   # Noël Tier 1 Hub
          - office   # Noëma Tier 1 Hub

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -eo pipefail {0}   # a failed build always shows as failed

jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install
        run: npm ci

      - name: Build the web app into the iPhone project
        run: |
          python3 build.py
          python3 scripts/build_www.py
          npx cap sync ios

      - name: Switch to Noëma (Office edition)
        if: github.event_name == 'workflow_dispatch' && inputs.edition == 'office'
        run: |
          python3 scripts/build_www.py office
          rm -rf ios/App/App/public && cp -R www-office ios/App/App/public
          python3 - <<'PY'
          import json
          p = "ios/App/App/capacitor.config.json"
          c = json.load(open(p))
          c.update({"appId": "com.noematier1hub.app", "appName": "Noëma Tier 1 Hub", "backgroundColor": "#151515"})
          c.setdefault("ios", {})["backgroundColor"] = "#151515"
          json.dump(c, open(p, "w"), indent=2, ensure_ascii=False)
          PY
          cp office-assets/AppIcon-1024.png "ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          sed -i '' 's/Noël/Noëma/g' ios/App/App/Info.plist   # name under the icon + Face ID / microphone messages
          echo "BUNDLE_ID=com.noematier1hub.app" >> "$GITHUB_ENV"

      - name: Check build (simulator, unsigned)
        if: github.event_name == 'push'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Check the four Apple secrets are all there
        if: github.event_name == 'workflow_dispatch'
        env:
          S1: ${{ secrets.APPLE_TEAM_ID }}
          S2: ${{ secrets.ASC_KEY_ID }}
          S3: ${{ secrets.ASC_ISSUER_ID }}
          S4: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$S1" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$S2" ] || missing="$missing ASC_KEY_ID"
          [ -n "$S3" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$S4" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi
          echo "All four secrets are present."

      - name: Save App Store Connect key
        if: github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_KEY_P8" || { echo "::error::Add the ASC_KEY_P8 secret first"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          # Rebuild a clean key file even if the header/footer lines were typed wrong or the line breaks were lost
          python3 - <<'PY'
          import os, re, textwrap
          raw = os.environ["ASC_KEY_P8"]
          body = re.sub(r"-+[A-Za-z ]*-+", "", raw)
          body = re.sub(r"\s+", "", body)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          open(os.path.join(os.environ["RUNNER_TEMP"], "keys", "AuthKey_" + os.environ["ASC_KEY_ID"] + ".p8"), "w").write(pem)
          print("key file written,", len(body), "characters of key data")
          PY

      - name: Test the Apple key (says which part is wrong)
        if: github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography
          python3 - <<'PY'
          import os, re, time, jwt, urllib.request, urllib.error
          kid = os.environ["ASC_KEY_ID"].strip(); iss = os.environ["ASC_ISSUER_ID"].strip()
          print("Key ID length:", len(kid), "(should be 10)")
          print("Issuer ID looks right:", bool(re.fullmatch(r"[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}", iss)), "(should be True)")
          pem = open(os.path.join(os.environ["RUNNER_TEMP"], "keys", "AuthKey_" + os.environ["ASC_KEY_ID"] + ".p8")).read()
          try:
              tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"}, pem, algorithm="ES256", headers={"kid": kid})
          except Exception as e:
              print("KEY FILE PROBLEM: the key text is not a valid key:", type(e).__name__); raise SystemExit(1)
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=5", headers={"Authorization": "Bearer " + tok})
          try:
              r = urllib.request.urlopen(req); print("Apple accepted the key. HTTP", r.status)
          except urllib.error.HTTPError as e:
              print("Apple answered HTTP", e.code, "- 401 = Key ID, Issuer ID or key text does not match; 403 = key needs Admin or App Manager access")
              raise SystemExit(1)
          PY

      - name: Archive (signing happens in the next step)
        if: github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Noel.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ${BUNDLE_ID:+PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID} \
            archive | tail -n 60

      - name: Upload to App Store Connect (TestFlight)
        if: github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Noel.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "✅ Uploaded build ${{ github.run_number }}. It appears in App Store Connect → TestFlight in about 15–30 minutes."
